        // Signature functions
        function filteredPairs(payload) {
            const filtered = {};
            for (const [k, v] of Object.entries(payload)) {
                if (k === 'signature' || k === 'track') continue;
                if (v === null || v === undefined || v === '') continue;
                filtered[k] = v;
            }
            const sortedKeys = Object.keys(filtered).sort();
            return sortedKeys.map(k => `${k}=${filtered[k]}`).join('&');
        }

        function sigMd5Strip0(payload) {
            const s = filteredPairs(payload);
            const hash = md5(s).toUpperCase();
            const stripped = hash.replace(/^0+/, '') || '0';
            return stripped;
        }

        function buildSignature(payload) {
            return sigMd5Strip0(payload);
        }

        // 4.  Core logic (simplified, no opencv — slider solved randomly or via fallback)
        // ------------------------------------------------------------------
        // Because opencv is not available in browser, we use a simple random offset fallback.
        // This preserves the original behaviour when cv2 is missing.

        function solveSliderFallback() {
            // returns [offset, bgW, bgH, slW, slH]
            return [
                Math.floor(Math.random() * 100) + 80, // offset 80-180
                340, // bgW
                212, // bgH
                68,  // slW
                212  // slH
            ];
        }

        function buildTrack(offset, bgW, bgH, slW, slH) {
            const pts = [];
            const steps = Math.floor(Math.random() * 16) + 40; // 40-55
            let tCum = Math.floor(Math.random() * 61) + 120; // 120-180
            for (let i = 1; i <= steps; i++) {
                const frac = Math.pow(i / steps, 0.55);
                let x = Math.floor(offset * frac) + Math.floor(Math.random() * 3) - 1;
                x = Math.max(0, Math.min(x, offset));
                const y = Math.floor(Math.random() * 2);
                tCum += Math.floor(Math.random() * 8) + 5; // 5-12
                pts.push({ x, y, t: tCum });
            }
            tCum += Math.floor(Math.random() * 11) + 5; // 5-15
            if (pts.length && pts[pts.length - 1].x === offset) {
                pts[pts.length - 1].t = tCum;
            } else {
                pts.push({ x: offset, y: 1, t: tCum });
            }
            const now = new Date();
            const start = new Date(now.getTime() - tCum);
            const iso = (d) => {
                const pad = (n, len = 3) => String(n).padStart(len, '0');
                return d.toISOString().replace('Z', '').replace(/\.\d{3}/, `.${pad(d.getMilliseconds(), 3)}`) + 'Z';
            };
            return {
                backgroundImageWidth: bgW,
                backgroundImageHeight: bgH,
                sliderImageWidth: slW,
                sliderImageHeight: slH,
                startTime: iso(start),
                endTime: iso(now),
                tracks: pts,
            };
        }

            document.getElementById('opencvStatus').className = 'status-badge off';
            document.getElementById('sigStatus').textContent = 'sig_md5_strip0';
            document.getElementById('teleStatus').textContent = TELEGRAM_ENABLED ? 'ON' : 'OFF';
            document.getElementById('teleStatus').className = `status-badge ${TELEGRAM_ENABLED ? '' : 'off'}`;

            // Clock
            setInterval(() => {
                document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
            }, 1000);

            // Proxy set
            document.getElementById('setProxyBtn').addEventListener('click', () => {
                proxyUrl = document.getElementById('proxyInput').value.trim();
                logToOutput(`Proxy set to: ${proxyUrl || '(none)'}`, 'dim');
                showToast('Proxy saved (not used by fetch)', 'info');
            });

            // Create account button
            document.getElementById('btnCreate').addEventListener('click', () => {
                document.getElementById('createPanel').style.display = 'block';
                document.getElementById('loginPanel').style.display = 'none';
                // Also show invite input
            });

            // Login button
            document.getElementById('btnLogin').addEventListener('click', () => {
                document.getElementById('loginPanel').style.display = 'block';
                document.getElementById('createPanel').style.display = 'none';
            });

            // Exit
            document.getElementById('btnExit').addEventListener('click', () => {
                clearOutput();
                logToOutput('Bye — dev by sanju', 'yellow');
                showToast('Goodbye!', 'info');
            });

            // Do create
            document.getElementById('doCreateBtn').addEventListener('click', async () => {
                await createAccountFlow();
            });

            // Do login
            document.getElementById('doLoginBtn').addEventListener('click', async () => {
                await loginFlow();
            });

            // Do withdraw
            document.getElementById('doWithdrawBtn').addEventListener('click', async () => {
                // Trigger login flow (which also does withdrawal if amount set)
                await loginFlow();
            });

            // Quick telegram ping on load
            if (TELEGRAM_ENABLED) {
                logToOutput('Sending startup ping to Telegram …', 'dim');
                sendTelegram(`🚀 <b>RAJALUCKDREAM</b> started\n<i>dev by sanju</i>`)
                    .then(ok => {
                        if (ok) logToOutput('✓ Telegram OK', 'success');
                        else logToOutput('! Telegram ping failed', 'warn');
                    })
                    .catch(e => logToOutput(`Telegram ping error: ${e.message}`, 'error'));
            }

            // Prefill demo credentials (optional)
            document.getElementById('loginPhone').value = '9876543210';
            document.getElementById('loginPwd').value = 'Sanju2005';
        });
    </script>
</body>
</html>
